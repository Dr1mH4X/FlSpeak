[package]
name = "audio"
description = "语音模块：双线程采集/播放、Opus、VAD、jitter 与设备后端"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# 采集与播放需要系统音频库（Linux 另需 alsa），Opus 为纯 Rust 实现。
# 默认关闭，保证没有这些依赖的机器上 workspace 仍可构建与测试。
audio = ["dep:rusty-opus", "dep:cpal", "dep:crossbeam-queue", "dep:nnnoiseless"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
rusty-opus = { version = "1.2.0", optional = true }
cpal = { version = "0.18.2", optional = true }
crossbeam-queue = { version = "0.3", optional = true }
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }