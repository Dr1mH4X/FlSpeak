[workspace]
resolver = "3"
members = [
    "core/audio",
    "core/proto",
    "core/server",
    "core/session",
    "plugins/flspeak_ffi/rust",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Dr1mH4X/FlSpeak"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tsclient-rs = { git = "https://github.com/ZeroBlock0/tsclient-rs.git", rev = "55f83f3d0746bd4d3626a2fa4bc937d943026bd7" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
rand = "0.10"
sha1 = "0.10"
base64 = "0.22"

audio = { path = "core/audio" }
proto = { path = "core/proto" }
server = { path = "core/server" }
session = { path = "core/session" }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
