name: flspeak
description: flspeak
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

hooks:
  user_defines:
    flspeak_ffi:
      build_assets: true

dependencies:
  file_selector: ^1.1.0
  pasteboard: ^0.6.0
  flutter_secure_storage: ^11.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.8.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.6
  flspeak_ffi:
    path: plugins/flspeak_ffi

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
