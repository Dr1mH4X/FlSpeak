name: checks

# 供 ci.yml 与 release.yml 共用：分支/PR 的常规门禁，以及发版前的检查门禁。
# 仅保留耗时短的静态检查与绑定校验（~40 秒），单测移至 tests.yml，避免阻塞后续打包。
on:
  workflow_call:

env:
  FLUTTER_VERSION: '3.50.0'
  # 与 plugins/flspeak_ffi/pubspec.yaml 的 flutter_rust_bridge 版本一致；校验和
  # 对应 x86_64-unknown-linux-gnu 的官方预编译附件。
  FRB_CODEGEN_VERSION: '2.13.0'
  FRB_CODEGEN_SHA256: '1bb088e6ea42782848ea6507ab745371dbde58c83abef137d3e1e68ce510d45b'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/flspeak_ffi/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libasound2-dev

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  bindings:
    name: Bindings & plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: bindings
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libasound2-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install codegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v${FRB_CODEGEN_VERSION}"
          archive="flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v${FRB_CODEGEN_VERSION}.tgz"

          if ! gh release download "v${FRB_CODEGEN_VERSION}" \
              --repo fzyzcjy/flutter_rust_bridge \
              --pattern "$archive" \
              --dir "$RUNNER_TEMP" \
              --clobber; then
            echo "gh release download 失败，回退到 curl 下载..."
            curl --proto '=https' --tlsv1.2 -fsSL \
              --retry 5 --retry-delay 3 --retry-all-errors \
              -o "$RUNNER_TEMP/$archive" "$base/$archive"
          fi

          actual=$(sha256sum "$RUNNER_TEMP/$archive" | cut -d' ' -f1)
          test "$actual" = "$FRB_CODEGEN_SHA256" || {
            echo "codegen 校验和不匹配: $actual" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/flutter_rust_bridge_codegen" --version

      - name: Check that generated bindings are up to date
        working-directory: plugins/flspeak_ffi
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code --stat -- plugins/flspeak_ffi; then
            echo '生成的绑定与提交的不一致，请本地重跑 flutter_rust_bridge_codegen generate' >&2
            exit 1
          fi

      - name: Analyze plugin
        working-directory: plugins/flspeak_ffi
        run: flutter analyze --no-fatal-infos
