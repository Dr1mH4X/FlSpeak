name: checks

# 供 ci.yml 与 release.yml 共用：分支/PR 的常规门禁，以及发版前的同一套门禁。
on:
  workflow_call:

env:
  FLUTTER_VERSION: '3.47.5'
  # 与 plugins/flspeak_ffi/pubspec.yaml 的 flutter_rust_bridge 版本一致；校验和
  # 对应 x86_64-unknown-linux-gnu 的官方预编译附件。
  FRB_CODEGEN_VERSION: '2.13.0'
  FRB_CODEGEN_SHA256: '1bb088e6ea42782848ea6507ab745371dbde58c83abef137d3e1e68ce510d45b'
  # audiopus_sys 内置的 Opus 用 `cmake_minimum_required(VERSION <3.5)`，CMake 4 默认拒绝；
  # 没装系统 libopus 的平台（macOS/Windows runner）只能走源码构建这条路。
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    # rust-toolchain.toml 必须留在 crate 目录里（native assets 钩子只在那里找），
    # 所以 cargo 也从这里跑，才能吃到锁定的工具链。
    defaults:
      run:
        working-directory: plugins/flspeak_ffi/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libasound2-dev

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  dart-test:
    name: Dart tests & plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `flutter test` 会跑 native assets 钩子，等于把 Rust 再编一遍：音频依赖与
      # cargo 缓存都按 rust 作业那一套准备，否则用例起不来。缓存单列一份 key，
      # 不和 rust 作业互相覆盖。
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: dart-test
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libasound2-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 预编译附件只覆盖 x86_64 linux，本作业跑在 ubuntu-latest 上；版本与
      # 校验和固定在文件顶部，升级 flutter_rust_bridge 时一起改。
      - name: Install codegen
        run: |
          base="https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v${FRB_CODEGEN_VERSION}"
          archive="flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v${FRB_CODEGEN_VERSION}.tgz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          actual=$(sha256sum "$RUNNER_TEMP/$archive" | cut -d' ' -f1)
          test "$actual" = "$FRB_CODEGEN_SHA256" || {
            echo "codegen 校验和不匹配: $actual" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/flutter_rust_bridge_codegen" --version

      # 生成物校验与单测共用一次 checkout、Flutter 与 native assets 编译；用例
      # 不写工作区，generate 之后再做 diff 仍然有效。
      - name: Check that generated bindings are up to date
        working-directory: plugins/flspeak_ffi
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code --stat -- plugins/flspeak_ffi; then
            echo '生成的绑定与提交的不一致，请本地重跑 flutter_rust_bridge_codegen generate' >&2
            exit 1
          fi

      - name: Analyze plugin
        working-directory: plugins/flspeak_ffi
        run: flutter analyze --no-fatal-infos

      # 用例与被测文件同目录，`flutter test` 的默认 test/ 目录用不上。
      - name: Test
        run: flutter test lib

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir website run typecheck

      - name: Build
        run: pnpm --dir website run build

