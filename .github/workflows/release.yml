name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 0.2.0）'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'
  NDK_VERSION: r28c
  # 见 checks.yml：audiopus_sys 内置 Opus 的 CMake 版本下限需要放宽。
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "$version" || { echo '拿不到版本号' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "版本：$version"

  # tag 与手动发版都先过同一套检查；任一检查失败，打包矩阵不会启动。
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  build:
    name: ${{ matrix.platform }} ${{ matrix.arch || 'all' }}
    needs: [ meta, checks ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
            arch: amd64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
    steps:
      # windows-11-arm runner 自带的是 x64 rustup，先装 aarch64 版本。
      - name: Setup Rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      # 四个 release secret 缺一不可：宁可发版失败，也不让 debug 签名的 APK 流出去。
      - name: Restore Android release signing key
        if: matrix.platform == 'android'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_KEYSTORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            test -n "${!name}" || missing="$missing $name"
          done
          test -z "$missing" || { echo "缺少 release 签名 secret:$missing" >&2; exit 1; }
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libopus-dev libasound2-dev

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # native assets 钩子在 %LOCALAPPDATA%\Temp 下编译，audiopus_sys 的 CMake
      # 中间文件会顶到 260 字符上限；换到短路径的 TEMP 后整条路径留出余量。
      - name: Use short temp directory (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP | Out-Null
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Package
        if: matrix.platform != 'android'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch || 'all' }} --version "${{ needs.meta.outputs.version }}"

      # 签名 secret 只进 Android 作业的环境，不带给其他平台的 runner。
      - name: Package Android
        if: matrix.platform == 'android'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # 相对 android/app/ 解析，与本地 key.properties 的 releaseStoreFile 一致。
          ANDROID_RELEASE_KEYSTORE_PATH: release.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: 'true'
        run: dart setup.dart android all --version "${{ needs.meta.outputs.version }}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  publish:
    name: Publish
    needs: [ meta, build ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          pattern: artifact-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          draft: true
          generate_release_notes: true
