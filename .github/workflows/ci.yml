name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: '3.47.5'
  NDK_VERSION: r28c
  # audiopus_sys 内置的 Opus 用 `cmake_minimum_required(VERSION <3.5)`，CMake 4 默认拒绝；
  # 没装系统 libopus 的平台（macOS/Windows runner）只能走源码构建这条路。
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  commit-msg:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the hook itself
        run: bash tool/check_commit_msg_test.sh

      - name: Check branch commits
        if: github.event_name == 'pull_request'
        run: |
          bash tool/check_commit_msg.sh \
            "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    # rust-toolchain.toml 必须留在 crate 目录里（native assets 钩子只在那里找），
    # 所以 cargo 也从这里跑，才能吃到锁定的工具链。
    defaults:
      run:
        working-directory: plugins/flspeak_ffi/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Install audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libasound2-dev

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  policy:
    name: Compliance policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/flspeak_ffi/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit official infrastructure references
        working-directory: .
        run: bash tool/audit_policy.sh

      - name: Run policy tests
        run: cargo test -p policy -p proto

  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Check that generated bindings are up to date
        working-directory: plugins/flspeak_ffi
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code --stat -- plugins/flspeak_ffi; then
            echo '生成的绑定与提交的不一致，请本地重跑 flutter_rust_bridge_codegen generate' >&2
            exit 1
          fi

      - name: Analyze plugin
        working-directory: plugins/flspeak_ffi
        run: flutter analyze --no-fatal-infos

  desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libopus-dev libasound2-dev

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install dependencies
        run: flutter pub get

      # 编译桌面 runner 与 native assets 钩子里的 Rust 代码；产物丢弃。
      - name: Build debug bundle
        run: flutter build ${{ matrix.platform }} --debug

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug apk
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --debug