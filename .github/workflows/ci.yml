name: ci

# main 与 PR 的常规门禁；tag 只走 release.yml，避免和发布矩阵重复构建。
# 纯文档改动不跑流水线：文档没有单独的 CI 检查，跑全量构建只浪费 runner。
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - 'website/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  NDK_VERSION: r28c
  # 见 checks.yml：audiopus_sys 内置 Opus 的 CMake 版本下限需要放宽。
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: [checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libopus-dev libasound2-dev libsecret-1-dev

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      # native assets 钩子在 %LOCALAPPDATA%\Temp 下编译，audiopus_sys 的 CMake
      # 中间文件会顶到 260 字符上限；换到短路径的 TEMP 后整条路径留出余量。
      - name: Use short temp directory (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP | Out-Null
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      # 预热 WebRTC XCFramework 缓存，避免 SwiftPM 走网页直链下载遭遇 GitHub Releases 504 超时。
      - name: Pre-cache WebRTC for SwiftPM (macOS)
        if: matrix.platform == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/Library/Caches/org.swift.swiftpm/artifacts
          target="$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_webrtc_sdk_Specs_releases_download_150_7871_04_WebRTC_xcframework_zip"
          if [ ! -f "$target" ]; then
            gh release download 150.7871.04 --repo webrtc-sdk/Specs --pattern "WebRTC.xcframework.zip" --dir "$RUNNER_TEMP" --clobber
            mv "$RUNNER_TEMP/WebRTC.xcframework.zip" "$target"
          fi

      # 预热 WebRTC 二进制依赖，避免 Linux CMake 走网页直链下载遭遇 GitHub Releases 504 超时。
      - name: Pre-cache WebRTC for CMake (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          webrtc_dir="$(find "${PUB_CACHE:-$HOME/.pub-cache}" -type d -name "flutter_webrtc-*" 2>/dev/null | head -n 1)"
          test -n "$webrtc_dir" || { echo "未在 pub-cache 中找到 flutter_webrtc" >&2; exit 1; }
          third_party="$webrtc_dir/third_party"
          mkdir -p "$third_party/downloads"
          asset="libwebrtc-linux-x64-release"
          zip_target="$third_party/downloads/${asset}.zip"
          if [ ! -f "$zip_target" ]; then
            if ! gh release download "libwebrtc.m150.7871.07" \
                --repo webrtc-sdk/libwebrtc \
                --pattern "${asset}.zip" \
                --dir "$RUNNER_TEMP" \
                --clobber; then
              echo "gh release download 失败，回退到 curl..."
              curl --proto '=https' --tlsv1.2 -fsSL \
                --retry 8 --retry-delay 5 --retry-all-errors \
                -o "$RUNNER_TEMP/${asset}.zip" \
                "https://github.com/webrtc-sdk/libwebrtc/releases/download/libwebrtc.m150.7871.07/${asset}.zip"
            fi
            mv "$RUNNER_TEMP/${asset}.zip" "$zip_target"
          fi
          if [ ! -f "$third_party/libwebrtc/lib/libwebrtc.so" ]; then
            rm -rf "$RUNNER_TEMP/webrtc_extract"
            mkdir -p "$RUNNER_TEMP/webrtc_extract"
            unzip -q "$zip_target" -d "$RUNNER_TEMP/webrtc_extract"
            rm -rf "$third_party/libwebrtc"
            if [ -d "$RUNNER_TEMP/webrtc_extract/linux-x64-release" ]; then
              mv "$RUNNER_TEMP/webrtc_extract/linux-x64-release" "$third_party/libwebrtc"
            else
              mv "$RUNNER_TEMP/webrtc_extract" "$third_party/libwebrtc"
            fi
          fi
          test -f "$third_party/libwebrtc/lib/libwebrtc.so" || {
            echo "预置后仍未在预期路径找到 libwebrtc.so" >&2
            exit 1
          }
          echo "WebRTC Linux 二进制已就位: $third_party/libwebrtc/lib/libwebrtc.so"

      # 保留完整 bundle，包含 Rust 动态库与 Flutter 资源。
      - name: Build debug bundle
        run: flutter build ${{ matrix.platform }} --debug

      - name: Archive Linux bundle
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -czf dist/flspeak-linux-x64-debug.tar.gz -C build/linux/x64/debug/bundle .

      - name: Archive macOS bundle
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Debug/flspeak.app dist/flspeak-macos-${{ runner.arch }}-debug.zip

      - name: Archive Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Debug/* -DestinationPath dist/flspeak-windows-x64-debug.zip

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: flspeak-${{ matrix.platform }}-${{ runner.arch }}-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          workspaces: plugins/flspeak_ffi/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter 的 Gradle 插件按 SDK 目录找 NDK；不链接时构建阶段会再下一份。
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle 依赖与构建状态；PR 上默认只读，main 上写入供后续运行复用。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install dependencies
        run: flutter pub get

      # 仓库自己的 debug APK 用固定的调试密钥；fork/PR 上没有 secret 时退回 runner
      # 默认的 debug keystore，不让外部 PR 因缺签名失败。
      - name: Restore Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 未配置，使用 runner 默认 debug keystore'
            exit 0
          fi
          missing=
          for name in ANDROID_DEBUG_KEYSTORE_PASSWORD ANDROID_DEBUG_KEY_ALIAS ANDROID_DEBUG_KEY_PASSWORD; do
            test -n "${!name}" || missing="$missing $name"
          done
          test -z "$missing" || { echo "缺少 debug 签名 secret:$missing" >&2; exit 1; }
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > android/app/debug-upload.jks
          echo 'ANDROID_DEBUG_KEYSTORE_PATH=debug-upload.jks' >> "$GITHUB_ENV"

      - name: Build debug apk
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: flspeak-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
